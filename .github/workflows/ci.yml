name: CI

on:
  # the Windows app; the Android app in mobile/ has its own workflows
  push:
    paths-ignore:
      - "mobile/**"
  pull_request:
    paths-ignore:
      - "mobile/**"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # Qt widgets (offscreen, used by the update tests) need these system libraries on Linux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # the same pinned packages as the release build (build-requirements.txt)
      - run: python -m pip install -r build-requirements.txt
      - run: python -m pyflakes glassbed tests tools
      - run: python -m pytest -q
