name: Mobile build

# Unsigned test build of the Android app as a workflow artifact – no keystore, no secrets.
# Prepared for tags android-v* (not used yet); can be started by hand.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      # without android/key.properties the release build stays unsigned
      - run: flutter build apk --release
      - name: Name and checksum
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/glassbed-android-unsigned.apk
          cd out && sha256sum glassbed-android-unsigned.apk | tee glassbed-android-unsigned.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: glassbed-android-unsigned-${{ github.ref_name }}
          path: mobile/out/
          if-no-files-found: error
          retention-days: 14
