name: Mobile build

# Android app (mobile/), two variants:
#   github – APKs for GitHub releases, with the optional update notice (lib/main_github.dart)
#   play   – for an app store later, without any update check (lib/main.dart)
# One APK per processor type (arm64-v8a, armeabi-v7a, x86_64).
#
# unsigned: pull requests and every run – no secrets; checks that the play variant contains no
#           update code.
# signed:   tags android-v* and manual runs – only inside the environment "release", which needs
#           an approval by AyberkBLT; the keystore exists only for the duration of the job.
on:
  push:
    tags: ["android-v*"]
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - name: Build both variants (unsigned)
        run: |
          flutter build apk --release --split-per-abi --flavor github -t lib/main_github.dart
          flutter build apk --release --split-per-abi --flavor play -t lib/main.dart
      - name: The play variant contains no update code
        run: |
          status=0
          for apk in build/app/outputs/flutter-apk/app-*-play-release.apk; do
            unzip -p "$apk" 'lib/*/libapp.so' > /tmp/libapp.so
            for s in "api.github.com" "ARFEP-IT-Service/Glassbed" "releases?per_page" "android-v"; do
              if grep -a -q -F "$s" /tmp/libapp.so; then echo "::error::$apk contains '$s'"; status=1; fi
            done
            unzip -p "$(echo "$apk" | sed 's/-play-/-github-/')" 'lib/*/libapp.so' > /tmp/libapp-github.so
            grep -a -q -F "api.github.com" /tmp/libapp-github.so || { echo "::error::github variant without update check"; status=1; }
          done
          exit $status
      - uses: actions/upload-artifact@v7
        with:
          name: glassbed-android-unsigned-${{ github.run_id }}
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

  signed:
    if: github.event_name != 'pull_request'
    needs: unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Keystore (only for this job)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build the github variant (signed)
        run: flutter build apk --release --split-per-abi --flavor github -t lib/main_github.dart
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      - name: Name, certificate, checksums
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            name="Glassbed-android-$version-$abi.apk"
            cp "build/app/outputs/flutter-apk/app-$abi-github-release.apk" "out/$name"
            "$apksigner" verify "out/$name"
            (cd out && sha256sum "$name" > "$name.sha256")
          done
          "$apksigner" verify --print-certs "out/Glassbed-android-$version-arm64-v8a.apk" | tee out/certificate.txt
          cp THIRD_PARTY_NOTICES.md out/
          { echo "## Glassbed for Android $version"; echo '```'; cat out/*.sha256; grep -E 'SHA-256' out/certificate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: glassbed-android-${{ github.ref_name }}
          path: mobile/out/
          if-no-files-found: error
          retention-days: 30
