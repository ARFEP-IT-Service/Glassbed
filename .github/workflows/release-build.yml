name: Release build

# Builds the Windows release (portable ZIP + installer) from this public repository.
# Runs for version tags and can be started by hand (Actions → Release build → Run workflow).
on:
  push:
    tags: ["v*"]          # Windows only; the Android app uses android-v* (mobile-build.yml)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # exactly the version in .python-version; build.ps1 checks it, creates a fresh venv from
      # build-requirements.txt, runs the tests and fetches the pinned NSIS
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Build portable ZIP and installer
        shell: pwsh
        run: ./build.ps1

      - name: List bundled components
        shell: pwsh
        run: |
          Get-Content build/bundled-components.md
          Get-Content build/bundled-components.md | Add-Content $env:GITHUB_STEP_SUMMARY

      # Optional code signing step: not used. If added later, Glassbed.exe is signed before
      # packaging and the setup.exe afterwards (see the two markers in build.ps1).

      - name: Show checksums
        shell: pwsh
        run: Get-Content dist/*.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glassbed-windows-${{ github.ref_name }}
          path: |
            dist/Glassbed-*-windows-portable.zip
            dist/Glassbed-*-setup.exe
            dist/*.sha256
            build/bundled-components.md
          if-no-files-found: error
          retention-days: 30
