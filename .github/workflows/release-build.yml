name: Release build

# Builds the Windows release (portable ZIP + installer) from this public repository.
# Runs for version tags and can be started by hand (Actions → Release build → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup (if the runner has none)
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
                   (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --yes --no-progress }

      - name: Build portable ZIP and installer
        shell: pwsh
        run: ./build.ps1

      # ------------------------------------------------------------------------------
      # CODE SIGNING – placeholder for SignPath (application pending, NOT active yet).
      # Once approved, Glassbed.exe has to be signed before packaging and the setup.exe
      # afterwards (see the two ">>> SignPath" markers in build.ps1). No token or secret
      # is configured in this repository.
      # ------------------------------------------------------------------------------

      - name: Show checksums
        shell: pwsh
        run: Get-Content dist/*.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glassbed-windows-${{ github.ref_name }}
          path: |
            dist/Glassbed-*-windows-portable.zip
            dist/Glassbed-*-setup.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
